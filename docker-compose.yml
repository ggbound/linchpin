services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: linchpin
      POSTGRES_PASSWORD: linchpin
      POSTGRES_DB: linchpin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linchpin"]
      interval: 5s
      timeout: 5s
      retries: 5

  linchpin-api:
    build:
      context: ./linchpin-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://linchpin:linchpin@postgres:5432/linchpin
      LINCHPIN_API_KEY: ${LINCHPIN_API_KEY:-changeme}
      CONNECTOR_URL: http://linchpin-connector:8001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      # Atlas B4 — image for the per-environment egress proxies that the
      # API creates dynamically on `linchpin-limited` (one per limited env,
      # allowlist derived from the env config).
      LINCHPIN_EGRESS_PROXY_IMAGE: ${LINCHPIN_EGRESS_PROXY_IMAGE:-ubuntu/squid:24.04_stable}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  linchpin-connector:
    build:
      context: ./linchpin-connector
    ports:
      - "8001:8001"
    environment:
      LINCHPIN_API_KEY: ${LINCHPIN_API_KEY:-changeme}

  linchpin-console:
    build:
      context: ./linchpin-console
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - linchpin-api

  # Atlas B11 — optional LiteLLM gateway. Not started by default; run
  # `docker compose --profile litellm up -d litellm` to enable. Agents then
  # reach any OpenAI-compatible upstream (including self-hosted models) via
  # provider="openrouter" + base_url=http://litellm:4000/v1.
  # See docs/model-gateway.md.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["litellm"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      # Key LiteLLM uses as its own OpenRouter upstream credential.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Key agents present as Bearer to the gateway (vault credential with
      # provider="openrouter", or OPENROUTER_API_KEY env fallback).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-linchpin}

volumes:
  pgdata:
