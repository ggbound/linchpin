[project]
name = "linchpin-sdk"
version = "0.1.0"
description = "Linchpin API client — zero-dependency Python SDK (FR-12.1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Linchpin" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# Zero runtime dependencies — stdlib urllib + json + codecs only,
# mirroring the fetch-based linchpin-sdk-ts. typing_extensions is only
# pulled in on Python 3.10 (Required/TypedDict backport).
dependencies = ["typing_extensions>=4.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/linchpin/linchpin"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
